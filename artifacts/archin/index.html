<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Responsive device-width viewport: phones render at their actual width,
         enabling all the responsive sm/md/lg Tailwind breakpoints to work
         correctly. viewport-fit=cover keeps env(safe-area-inset-*) available
         so fixed elements can clear the notch and home indicator.
         No maximum-scale so pinch-zoom still works. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>ROAR Architects | Architecture Studio in Hyderabad</title>

    <meta property="og:title" content="ROAR Architects | Architecture Studio in Hyderabad" />
    <meta property="og:description" content="ROAR Architects is a Hyderabad-based architecture and interior design studio, with an active studio in Visakhapatnam." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
