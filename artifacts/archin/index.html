<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- A fixed layout width rather than device-width, so a phone lays the site
         out as a desktop does and scales the result down to fit. With
         device-width the viewport reports the phone's own narrow size, every
         responsive rule below lg falls away, and the pages reflow into single
         columns — which is what we do NOT want here: the brief is for mobile to
         show the same composition as the browser.

         1040 is chosen to sit just above lg (1024px), the breakpoint every
         desktop layout on this site is built on. The width also decides the
         HEIGHT the phone reports: the browser divides the device height by the
         same scale factor, so a wider figure buys a proportionally taller
         viewport. At 1440 a 440px phone reported 3128 CSS px of height while
         the team page only fills about 1550 — the rest was blank. 1040 cuts
         that to roughly 2260 and renders all the type about 40% larger besides.
         The cost is the xl rules (1280px), four in total: the hero's two
         vertical edge labels and the team sheet's studio line. Those are edge
         decoration; the layouts themselves all key off lg and survive.

         Desktop browsers ignore this tag entirely, so it changes nothing there.
         No maximum-scale, so pinch-zoom still works.
         viewport-fit=cover keeps env(safe-area-inset-*) available so fixed
         elements can clear the notch and home indicator. -->
    <meta name="viewport" content="width=1040, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>ROAR Architects | Architecture Studio in Hyderabad</title>
    <meta name="description" content="ROAR Architects is a Hyderabad-based architecture and interior design studio, with an active studio in Visakhapatnam." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="ROAR Architects | Architecture Studio in Hyderabad" />
    <meta property="og:description" content="ROAR Architects is a Hyderabad-based architecture and interior design studio, with an active studio in Visakhapatnam." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ROAR Architects | Architecture Studio in Hyderabad" />
    <meta name="twitter:description" content="ROAR Architects is a Hyderabad-based architecture and interior design studio, with an active studio in Visakhapatnam." />

    <link rel="preconnect" href="https://fonts.googleapis.com">
