  <line x1="277" y1="447" x2="277" y2="556" stroke="#000000" stroke-width="1" opacity="0.6" />
  <line x1="340" y1="444" x2="340" y2="554" stroke="#000000" stroke-width="1" opacity="0.6" />
  <line x1="465" y1="438" x2="465" y2="549" stroke="#000000" stroke-width="1" opacity="0.6" />
  <line x1="527" y1="435" x2="527" y2="547" stroke="#000000" stroke-width="1" opacity="0.6" />

